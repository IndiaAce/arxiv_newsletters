name: fetch-ml-papers

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        # remove persist-credentials: false so GitHub token is configured automatically

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: run fetch script
        run: |
          python scripts/fetch_arxiv_papers.py

      - name: commit and push changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily_papers LATEST_PAPERS.md
            git commit -m "update daily ml paper digest $(date -u +%F)"
            git push
          else
            echo "no changes to commit"
          fi
